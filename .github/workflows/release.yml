name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          set -euo pipefail
          mkdir -p build/kremote.koplugin
          # 白名单式拷贝容易漏文件（新增 panel.html / library.lua 时就漏过一次），
          # 改成整目录同步再排除开发用的东西
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' \
                --exclude='docs' --exclude='build' \
                ./ build/kremote.koplugin/
          cd build
          zip -r ../kremote.koplugin.zip kremote.koplugin
          cd ..
          unzip -l kremote.koplugin.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" kremote.koplugin.zip \
              --title "kremote.koplugin ${TAG}" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" kremote.koplugin.zip \
              --title "kremote.koplugin ${TAG}" \
              --generate-notes
          fi
