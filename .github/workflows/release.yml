name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          set -euo pipefail
          mkdir -p build/kremote.koplugin
          cp _meta.lua main.lua httpcore.lua build/kremote.koplugin/
          cp README.md LICENSE build/kremote.koplugin/
          cd build
          zip -r ../kremote.koplugin.zip kremote.koplugin
          cd ..
          unzip -l kremote.koplugin.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" kremote.koplugin.zip \
              --title "kremote.koplugin ${TAG}" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" kremote.koplugin.zip \
              --title "kremote.koplugin ${TAG}" \
              --generate-notes
          fi
